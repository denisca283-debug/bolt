name: Foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Real PostgreSQL sourcing concurrency
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          FILMVERSE_PG_BIN="$(pg_config --bindir)" npm run test:concurrency
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
